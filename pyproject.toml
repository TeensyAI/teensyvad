[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teensyvad"
version = "0.1.0"
description = "A tiny, ultra-fast voice activity detector (VAD) for telephony audio, built for learning — pure numpy, no deep-learning framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib"]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["teensyvad*"]

[tool.setuptools.package-data]
teensyvad = ["models/*.npz"]
